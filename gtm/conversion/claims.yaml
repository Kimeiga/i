  # ------------------------------------------------------------- pending -----
  - id: P001
    text: Scan any public URL from the browser, with no install.
    status: pending
    requirement: >-
      The hosted scanner does not exist. The runtime layer can do this
      technically, but nothing is deployed. May not appear on any page, in any
      tense, until it is running.
    note: >-
      This would be the strongest possible ungated first value and it is the
      highest-leverage thing to build next. It is still not a thing we may say.

  - id: P002
    text: Historical trend tracking, signed evidence export, organisation policy.
    status: pending
    requirement: apps/api is written and tested but is not deployed.
    allowed_wording: >-
      May be described on the pricing page as not yet available, with no
      purchase possible. May not be described as a feature you can use today.

  - id: P003
    text: LLM-proposed patches delivered as reviewable pull requests.
    status: pending
    requirement: Phase 4, blocked on revenue by design.

  # ----------------------------------------------------------- prohibited ---
  - id: X001
    text: Attest makes you compliant / EAA-compliant / WCAG-compliant.
    status: prohibited
    reason: >-
      False. Conformance is a determination about a whole service, normally
      requiring human evaluation. This is the exact claim the FTC fined accessiBe
      for. See C062.

  - id: X002
    text: Any customer count, logo, testimonial, or case study.
    status: prohibited
    reason: There are no customers. Manufacturing social proof is fraud.

  - id: X003
    text: Any quantified time or money saving.
    status: prohibited
    reason: >-
      No evidence exists. "Save 20 hours a month" is the easiest sentence to
      write and the hardest to defend.

  - id: X004
    text: Attest prevents lawsuits, regulatory action, or penalties.
    status: prohibited
    reason: Unsupportable and legally dangerous.

  - id: X005
    text: Complete, full, or 100% WCAG coverage.
    status: prohibited
    reason: Contradicts C011, which is the product's own stated limit.

  - id: X006
    text: A false-positive rate, precision, or accuracy figure.
    status: prohibited
    reason: >-
      We have not measured one on a labelled corpus. Two false positives found
      and fixed (C050) is a fact; a rate derived from it would be invented.

  - id: X007
    text: Comparative superlatives about competing products.
    status: prohibited
    reason: >-
      axe is better at detection than we are and we say so. A superlative here
      would be both false and the thing that gets us dismissed by the only
      community that matters.
