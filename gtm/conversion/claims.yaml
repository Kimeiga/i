# The claim graph.
#
# A model may not turn a product description into a marketing claim. It may only
# assemble claims from this file, by id. `scripts/check-claims.mjs` fails the
# build when a page cites an id that is missing, prohibited, pending, or stale.
#
# This is the generalisation of scripts/check-forbidden-words.mjs. That script
# catches a bad phrase. This one catches a true-sounding sentence that nothing
# in the repository supports — which is the more common and more expensive
# failure, and the one that produced the FTC's accessiBe order.
#
# status:
#   verified   — evidence exists in this repository and is named below
#   pending    — will be true, is not yet; may not appear on any page
#   prohibited — must never appear, with the reason recorded

version: 1
reviewed_on: 2026-08-11

claims:
  # ------------------------------------------------------------- what it is --
  - id: C001
    text: Attest is a CI check for React and Next.js codebases.
    status: verified
    evidence:
      - packages/cli/src/commands/scan.ts
      - packages/action/action.yml
    scope: React and Next.js only

  - id: C002
    text: >-
      Attest reports what a pull request changed, rather than listing everything
      wrong with the codebase.
    status: verified
    evidence:
      - packages/core/src/diff.ts
      - packages/cli/test/e2e.test.ts::survives an unrelated edit above a finding

  - id: C003
    text: >-
      Findings are fingerprinted without line numbers, so adding an import at
      the top of a file does not report the findings below it as new.
    status: verified
    evidence:
      - packages/core/src/identity.ts
      - packages/cli/test/e2e.test.ts::survives an unrelated edit above a finding
    note: This is the property the semantic diff rests on and it is under test.

  - id: C004
    text: Attest ships 30 rules across four layers.
    status: verified
    evidence:
      - packages/cli/src/rules.ts
      - scripts/check-rule-docs.mjs
    freshness: Recount on every rule change; the docs check enforces the number.

  # ------------------------------------------------------ accessibility ------
  - id: C010
    text: >-
      Runtime accessibility detection is performed by axe-core, developed and
      maintained by Deque Systems, used under the Mozilla Public License 2.0.
      Attest wraps axe-core; it does not fork or modify it.
    status: verified
    evidence:
      - packages/rules-a11y/src/runtime/context.ts
      - LICENSE
    required_on: any page showing an accessibility finding
    note: Both a licence obligation and the reason practitioners will listen.

  - id: C011
    text: >-
      Automated tooling can evaluate roughly a quarter to a third of WCAG 2.1
      success criteria.
    status: verified
    qualifier: stated as a range on purpose
    evidence:
      - docs/what-attest-cannot-detect.md
      - packages/core/src/product.ts::AUTOMATED_COVERAGE_NOTE
    note: >-
      Published estimates vary by methodology and we have not run our own study.
      A precise percentage would be a number we cannot defend.

  - id: C012
    text: >-
      The 14 runtime accessibility rules are tested against a real browser
      loading real pages, not against fixtures alone.
    status: verified
    evidence:
      - packages/rules-a11y/test/runtime-fixtures.test.ts

  - id: C013
    text: >-
      Where axe-core classifies a rule as a best practice rather than a WCAG
      requirement, Attest labels it the same way.
    status: verified
    evidence:
      - packages/rules-a11y/src/runtime/rules.ts::a11y/heading-order
      - packages/rules-a11y/test/static-fixtures.test.ts::never claims a WCAG criterion for an axe best-practice rule

  # ----------------------------------------------------------- the graph -----
  - id: C020
    text: >-
      A 'use client' directive marks a boundary, not a file. Everything a client
      module imports also ships to the browser, however many hops away.
    status: verified
    evidence:
      - packages/core/src/static/client-graph.ts
    scope: Next.js App Router and Pages Router

  - id: C021
    text: >-
      Scanning vercel/commerce at commit 3761e52 found that lib/utils.ts, which
      contains no 'use client' directive, reaches the browser through
      components/cart/modal.tsx and reads process.env.VERCEL_PROJECT_PRODUCTION_URL
      — which is undefined in the client bundle.
    status: verified
    evidence:
      - gtm/public-scans/reports/commerce.json
      - gtm/public-scans/2026-08-vercel-commerce.md
    hash: sha256:b1b8c3b98a1b3622
    reproducible: true
    note: >-
      Whether it is a live bug depends on whether client code reads baseUrl. The
      page must say so; "real, currently benign, and a trap for the next person"
      is the honest framing and it is more credible than the alternative.

  - id: C022
    text: >-
      A fetch that sends a per-session credential and also carries a caching
      directive stores its response in the Next.js Data Cache, which is keyed by
      URL and request options rather than by user.
    status: verified
    evidence:
      - packages/rules-privacy/src/rules/session-data-in-shared-cache.ts
      - docs/rules/privacy-session-data-in-shared-cache.md
    scope: Next.js App Router
    note: The rule requires both signals on the same call before it reports.

  - id: C023
    text: >-
      Scanning vercel/ai-chatbot at commit c2f8235 found two operations in a
      route handler that the response does not wait for, one of which is a
      database write.
    status: verified
    evidence:
      - gtm/public-scans/reports/ai-chatbot.json
      - gtm/public-scans/2026-08-vercel-ai-chatbot.md
    hash: sha256:1e5e8f784ce3ce6f

  # -------------------------------------------------------- the trail --------
  - id: C030
    text: >-
      Two scans of identical code produce an identical content hash on a
      different machine, on a different branch, at a different time.
    status: verified
    evidence:
      - packages/core/src/engine.ts::computeContentHash
      - packages/cli/test/e2e.test.ts::hashes identical code identically

  - id: C031
    text: >-
      Suppressed findings stay in the report with the reason the developer gave.
    status: verified
    evidence:
      - packages/core/src/engine.ts
      - packages/cli/test/e2e.test.ts::records a suppression instead of dropping the finding

  - id: C032
    text: >-
      A layer that could not run is reported as "did not run", never as clean,
      and the diff excludes layers that ran on only one side.
    status: verified
    evidence:
      - packages/core/src/diff.ts
      - packages/cli/test/e2e.test.ts::refuses to compare a layer that ran on only one side

  - id: C033
    text: >-
      Attest refuses to read a report whose contents no longer match its own
      hash.
    status: verified
    evidence:
      - packages/core/src/report-io.ts
      - packages/cli/test/e2e.test.ts::rejects a report whose contents no longer match its hash

